<!doctype html>
<html>
  <head lang="en">
    <title>Streamer: Mute channel</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Streamer slider">
      <sdpi-select
        setting="selectedSlider"
        placeholder="Please choose a streamer slider"
      >
        <option value="streaming">Streaming</option>
        <option value="monitoring">Monitoring</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Channel to toggle">
      <sdpi-select
        setting="selectedChannel"
        placeholder="Please choose a channel"
      >
        <option value="master">Master</option>
        <option value="game">Game</option>
        <option value="chatRender">Chat</option>
        <option value="media">Media</option>
        <option value="aux">Aux</option>
        <option value="chatCapture">Mic</option>
      </sdpi-select>
    </sdpi-item>
  </body>
</html>
