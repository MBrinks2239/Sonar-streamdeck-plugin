<!doctype html>
<html>
  <head lang="en">
    <title>Streamer: Cycle dial</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Mix">
      <sdpi-select setting="selectedSlider" default="streaming">
        <option value="streaming">Streaming</option>
        <option value="monitoring">Monitoring</option>
      </sdpi-select>
    </sdpi-item>

    <!-- Double-tap cycles through the channels set here, in order. "None" slots are skipped. -->
    <sdpi-item label="Channel 1">
      <sdpi-select setting="cycleChannel1" default="game">
        <option value="none">None</option>
        <option value="master">Master</option>
        <option value="game">Game</option>
        <option value="chatRender">Chat</option>
        <option value="media">Media</option>
        <option value="aux">Aux</option>
        <option value="chatCapture">Mic</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Channel 2">
      <sdpi-select setting="cycleChannel2" default="chatRender">
        <option value="none">None</option>
        <option value="master">Master</option>
        <option value="game">Game</option>
        <option value="chatRender">Chat</option>
        <option value="media">Media</option>
        <option value="aux">Aux</option>
        <option value="chatCapture">Mic</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Channel 3">
      <sdpi-select setting="cycleChannel3" default="media">
        <option value="none">None</option>
        <option value="master">Master</option>
        <option value="game">Game</option>
        <option value="chatRender">Chat</option>
        <option value="media">Media</option>
        <option value="aux">Aux</option>
        <option value="chatCapture">Mic</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Channel 4">
      <sdpi-select setting="cycleChannel4" default="none">
        <option value="none">None</option>
        <option value="master">Master</option>
        <option value="game">Game</option>
        <option value="chatRender">Chat</option>
        <option value="media">Media</option>
        <option value="aux">Aux</option>
        <option value="chatCapture">Mic</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Channel 5">
      <sdpi-select setting="cycleChannel5" default="none">
        <option value="none">None</option>
        <option value="master">Master</option>
        <option value="game">Game</option>
        <option value="chatRender">Chat</option>
        <option value="media">Media</option>
        <option value="aux">Aux</option>
        <option value="chatCapture">Mic</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Step size">
      <sdpi-textfield
        setting="stepSize"
        placeholder="Please enter a step size"
        pattern="^([0-9]|([1-9][0-9])|100)$"
        required
      >
      </sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Double-tap wait">
      <sdpi-range id="double-tap-wait" setting="doubleTapWaitMs" min="100" max="1000" step="50" default="300" showlabels>
        <span slot="min">100</span>
        <span slot="max">1000</span>
      </sdpi-range>
    </sdpi-item>
    <sdpi-item>
      <span id="double-tap-wait-value"></span>
    </sdpi-item>

    <script>
      // The range control doesn't show its value, so show it below.
      const range = document.getElementById("double-tap-wait");
      const label = document.getElementById("double-tap-wait-value");
      const showWait = () => {
        const ms = Number(range.value) || 300;
        label.textContent = `${ms} ms (tap waits this long for a second tap)`;
      };
      range.addEventListener("input", showWait);
      range.addEventListener("change", showWait);
      setInterval(showWait, 250); // also catches the saved value once it has loaded
      showWait();
    </script>
  </body>
</html>
